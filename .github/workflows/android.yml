# Builds the Android test app (mobile/) and puts it on the "android-test" release,
# so it can be downloaded and installed on a phone straight from GitHub.
name: Android test app

on:
  push:
    branches: [main, android-app]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Build
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the file
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Hunting4Cards-test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Android testapp
          prerelease: true
          overwrite_files: true
          body: |
            Testversie van de Hunting4Cards-app voor Android, gebouwd van ${{ github.sha }} (${{ github.ref_name }}).
            Download Hunting4Cards-test.apk op je telefoon en open het bestand om te installeren.
          files: Hunting4Cards-test.apk
