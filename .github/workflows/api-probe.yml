name: api-probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-search-name-set
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Test scan
        run: |
          (npm start -- -p 3000 > server.log 2>&1 &)
          sleep 8
          s() { echo "=== $1: $2"; python3 -c "import json,sys; print(json.dumps({'text': sys.argv[1].replace('|', '\n')}))" "$2" > body.json; curl -sS -m 120 -X POST -H 'Content-Type: application/json' --data @body.json "http://localhost:3000/api/scan/$1" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('exact'), d.get('sure'), d.get('read'), d.get('language'), [(c['ref'], c['name']) for c in d.get('cards', [])])"; }
          for q in "Gengar ex 30c" "30C Gengar" "Pikachu ex" "Gengar" "PBL 048"; do echo "=== $q"; curl -sS -G --data-urlencode "q=$q" "http://localhost:3000/api/scan" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('exact'), [(c['ref'], c['name'], c['code']) for c in d.get('cards', [])][:6])"; done
          for p in /onepiece/scan /yugioh/scan /scan; do curl -sS -o /dev/null -w "$p %{http_code}\n" "http://localhost:3000$p"; done
          tail -20 server.log
