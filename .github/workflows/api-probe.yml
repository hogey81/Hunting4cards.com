name: api-probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          cat > p.py <<'PY'
          import json, urllib.request, collections
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Hunting4Cards/1.0"}), timeout=120).read())
          for cid in ["30th-154", "30th-090", "30th-001", "me05-048"]:
              c = get(f"https://api.tcgdex.net/v2/en/cards/{cid}")
              print(cid, c.get("name"), c.get("variants_detailed"), (c.get("pricing") or {}).get("cardmarket"))
          s = get("https://api.tcgdex.net/v2/en/sets/30th")
          print("set", s.get("name"), s.get("cardCount"))
          linked = 0
          for card in s["cards"]:
              pass
          prods = get("https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json")["products"]
          g = [p for p in prods if p["name"].startswith("Gengar")]
          exps = collections.Counter(p["idExpansion"] for p in g)
          print(len(prods), sorted(g, key=lambda p: -p["idProduct"])[:12])
          guide = {r["idProduct"]: r for r in get("https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json")["priceGuides"]}
          for p in sorted(g, key=lambda p: -p["idProduct"])[:6]:
              print(p["idProduct"], p["name"], p["idExpansion"], guide.get(p["idProduct"], {}).get("trend"))
          PY
          python3 p.py
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Hunting4Cards/1.0"}), timeout=120).read())
          s = get("https://api.tcgdex.net/v2/en/sets/30th")
          ids = [c["id"] for c in s["cards"]]
          miss = 0
          for cid in ids[::10]:
              c = get(f"https://api.tcgdex.net/v2/en/cards/{cid}")
              has = any((v.get("thirdParty") or {}).get("cardmarket") for v in (c.get("variants_detailed") or []))
              if not has: miss += 1
              print(cid, c["name"], has)
          print("missing", miss, "of", len(ids[::10]))
          PY
