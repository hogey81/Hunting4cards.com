name: api-probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://www.hunting4cards.com/beheer)
            echo "try $i: /beheer HTTP $code"
            [ "$code" = "200" ] && break
            sleep 30
          done
          curl -sSI https://www.hunting4cards.com/ | grep -iE "^(x-frame|x-content|referrer|permissions)"
