name: api-probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe card APIs
        run: |
          p() { echo "=== $1"; curl -sSL -m 60 -A "Hunting4Cards/1.0" "$1" | head -c ${2:-1500}; echo; }
          p https://db.ygoprodeck.com/api/v7/cardsets.php 600
          p "https://db.ygoprodeck.com/api/v7/cardinfo.php?cardset=Legend%20of%20Blue%20Eyes%20White%20Dragon" 1500
          p https://api.scryfall.com/sets/mkm 800
          p "https://api.scryfall.com/cards/search?q=e:mkm&unique=prints&order=set" 1200
          p https://api.lorcast.com/v0/sets 800
          p https://api.lorcast.com/v0/sets/1/cards 1500
          p "https://api.lorcast.com/v0/cards/search?q=elsa" 600
          p https://optcgapi.com/api/allSets/ 800
          p https://optcgapi.com/api/sets/OP-01/ 1500
          p https://optcgapi.com/api/allDecks/ 600
          p "https://digimoncard.io/api-public/search?n=agumon" 1500
          p "https://digimoncard.io/api-public/search.php?n=agumon" 1500
          p "https://digimoncard.io/api-public/getAllCards?sort=name&series=Digimon%20Card%20Game" 600
          p https://api.swu-db.com/cards/sor 1500
          p "https://api.swu-db.com/cards/search?q=name:luke" 800
          p https://raw.githubusercontent.com/the-fab-cube/flesh-and-blood-cards/develop/json/english/set.json 1200
          curl -sSL -m 60 -o card.json https://raw.githubusercontent.com/the-fab-cube/flesh-and-blood-cards/develop/json/english/card.json; ls -la card.json; head -c 2500 card.json; echo
          for g in 1 3 6 7 10 13 15 16 18 19 20 21 22 23 24 25; do echo "=== cardmarket game $g"; curl -sSL -m 60 "https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_$g.json" | head -c 500; echo; done
          echo "=== price guide 19"; curl -sSL -m 60 https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_19.json | head -c 600; echo
