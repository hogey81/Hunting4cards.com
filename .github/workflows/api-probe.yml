name: api-probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe card APIs
        run: |
          p() { echo "=== $1"; curl -sSL -m 60 -A "Hunting4Cards/1.0" "$1" | head -c ${2:-1500}; echo; }
          p https://api.swu-db.com/sets 800
          for c in SOR SHD TWI JTL LOF SEC IBH LAW ATC; do echo "== swu $c"; curl -sS -m 30 "https://api.swu-db.com/cards/$c" | head -c 160; echo; done
          p "https://digimoncard.io/api-public/search?pack=BT-02" 600
          curl -sS -m 30 -o /dev/null -w "digimon img %{http_code}\n" https://images.digimoncard.io/images/cards/BT2-043.jpg
          p "https://digimoncard.io/api-public/search?n=agumon" 4000 | grep -o '"image[^,]*' | head
          curl -sS -m 30 https://optcgapi.com/api/sets/OP-01/ | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d)); print(sorted({c['card_image_id'] for c in d})[:12]); print([c['card_set_id'] for c in d if c['card_set_id']=='OP01-001'])"
          p https://optcgapi.com/api/decks/ST-01/ 400
          p https://optcgapi.com/api/allPromos/ 300
          p "https://api.riftcodex.com/cards?page=1" 600
          p https://api.riftcodex.com/sets 600
          for g in 2 4 5 8 9 11 12 14 17 26 27 28 29 30; do echo "=== cardmarket game $g"; curl -sSL -m 60 "https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_$g.json" | head -c 300; echo; done
          for g in 16 18 19 21; do echo "=== names game $g"; curl -sSL -m 120 "https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_$g.json" | python3 -c "import json,sys; d=json.load(sys.stdin)['products']; print(len(d)); import random; random.seed(1); [print(p['name'], p['idExpansion']) for p in random.sample(d, 25)]"; done
          echo "=== price fields 18"; curl -sSL -m 60 https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_18.json | head -c 500; echo
          echo "=== lorcana dupes"; curl -sSL -m 120 https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_19.json | python3 -c "import json,sys,collections; d=json.load(sys.stdin)['products']; c=collections.Counter(p['name'] for p in d); print(len(d), sum(1 for v in c.values() if v>1)); print([k for k,v in c.items() if v>1][:15])"
          ls -la; curl -sSL -m 60 -o card.json https://raw.githubusercontent.com/the-fab-cube/flesh-and-blood-cards/develop/json/english/card.json; python3 -c "import json; d=json.load(open('card.json')); print(len(d)); print([(c['name'], c.get('pitch')) for c in d[:8]])"
