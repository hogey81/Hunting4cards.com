name: api-probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: more-games-cards
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Test pages
        run: |
          (npm start -- -p 3000 > server.log 2>&1 &)
          sleep 8
          t() { echo "=== $1"; curl -sS -m 120 -o page.html -w "%{http_code} %{time_total}s\n" "http://localhost:3000$1"; python3 - "$2" <<'PY'
          import re, sys, html
          s = open("page.html").read()
          s = re.sub(r"<script.*?</script>|<style.*?</style>", " ", s, flags=re.S)
          t = html.unescape(re.sub(r"<[^>]+>", " ", s))
          t = re.sub(r"\s+", " ", t)
          i = t.find(sys.argv[1]) if sys.argv[1] else 0
          print(t[max(i,0):max(i,0)+900])
          print("imgs:", re.findall(r'<img[^>]+src="([^"]+)"', open("page.html").read())[:3])
          PY
          }
          t /starwars "Nieuwste"
          t /onepiece/kaart/OP-01/OP01-120 "Shanks"
          t /onepiece/kaart/OP-01/OP01-120_p1 "Shanks"
          t "/onepiece/zoeken?q=zoro" ""
          t /digimon/kaart/BT1-084 "Omnimon"
          t "/digimon/zoeken?q=agumon" ""
          t /starwars "Star Wars"
          t /starwars/sets/SOR ""
          t /starwars/kaart/SOR/051 ""
          t /starwars/kaart/SOR/317 ""
          t "/starwars/zoeken?q=luke+skywalker" ""
          t /fab "Flesh"
          t /fab/sets/MST ""
          t /fab/kaart/1HP/360 "Command"
          t "/fab/zoeken?q=command" ""
          t /lorcana/kaart/1/42 ""
          t /lorcana/kaart/1/207 ""
          echo "=== prices"
          curl -sS -m 180 "http://localhost:3000/api/prices?ids=op:OP-01/OP01-120,op:OP-01/OP01-120_p1,dgm:BT1-084,swu:SOR/051,fab:1HP/360,lor:1/42,lor:1/207,mtg:mkm/1,ygo:LOB-EN001~UR" | head -c 4000; echo
          echo "=== sets api"
          curl -sS -m 120 "http://localhost:3000/api/sets?ids=op:OP-01,dgm:BT1,swu:SOR,fab:MST,lor:1" | head -c 2000; echo
          echo "=== server log"; tail -40 server.log
