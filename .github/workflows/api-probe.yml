name: api-probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-search-name-set
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Test
        run: |
          (npm start -- -p 3000 > server.log 2>&1 &)
          sleep 8
          curl -sS -m 180 "http://localhost:3000/api/prices?ids=30th-154,30th-090,30th-001,30th-c-001,me05-048,sv08-057" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(c['id'], c['name'], c['normal']['trend'], c['reverse']['trend']) for c in d['cards']]; print(d['failed'])"
          curl -sS "http://localhost:3000/kaart/30th-154" | grep -o "€[^<]*" | head -5
          tail -5 server.log
